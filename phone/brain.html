<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04080b">
<title>Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #04080b;
  --ink-2: #08121a;
  --line: rgba(116, 224, 255, .14);
  --line-2: rgba(116, 224, 255, .30);
  --cyan: #74e0ff;
  --cyan-2: #4aa9c6;
  --amber: #ffb547;
  --text: #d8e6ec;
  --muted: #7e95a0;
  --faint: #4d626c;
  --ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ink); color: var(--text); font: 14px/1.45 var(--ui); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- frame ---------- */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr) 320px; grid-template-rows: 68px minmax(0, 1fr); height: 100vh; height: 100dvh; }
header { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 22px; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark svg { flex: none; }
.back { display: grid; place-items: center; width: 36px; height: 36px; margin-left: -8px; color: var(--text); }
.mark b { display: block; font-weight: 600; font-size: 16px; letter-spacing: .06em; text-transform: uppercase; }
.mark span { display: block; font: 11px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { text-align: center; font-family: var(--mono); line-height: 1.1; }
.clock .t { font-size: 26px; font-weight: 500; letter-spacing: .04em; }
.clock .t small { font-size: 14px; color: var(--muted); margin-left: 2px; }
.clock .d { font-size: 11px; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; }
.wx { justify-self: end; text-align: right; font-family: var(--mono); line-height: 1.25; }
.wx .now { font-size: 18px; }
.wx .now em { font-style: normal; color: var(--muted); font-size: 12px; font-family: var(--ui); margin-left: 6px; }
.wx .alert { display: inline-block; margin-top: 3px; font-size: 11px; color: var(--amber); letter-spacing: .08em; text-transform: uppercase; }

.rail { overflow-y: auto; padding: 18px 20px 24px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.rail.left { border-right: 1px solid var(--line); }
.rail.right { border-left: 1px solid var(--line); }
.sec + .sec { margin-top: 24px; }
.sec h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.sec h2 i { flex: 1; height: 1px; background: var(--line); }
.sec h2 em { font: 11px var(--mono); font-style: normal; color: var(--faint); letter-spacing: 0; }
.row { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row.one { grid-template-columns: minmax(0, 1fr); }
.row .k { font: 12px/1.5 var(--mono); color: var(--cyan-2); white-space: nowrap; }
.row .v { min-width: 0; }
.row .v small { display: block; color: var(--muted); font-size: 12px; }
.row.past { opacity: .42; }
.row.next .k { color: var(--amber); }
.row.alert .v { color: var(--amber); }
.row.mem { cursor: pointer; }
.row.mem:hover .v { color: #fff; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; background: var(--faint); }
.dot.working { background: var(--cyan); }
.dot.waiting { background: var(--amber); }
.song b { display: block; font-weight: 500; font-size: 15px; }
.song span { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-family: var(--mono); }
.stats b { display: block; font-size: 18px; font-weight: 500; }
.stats span { font: 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* the plan: the next thing, big */
.upnext { position: relative; padding: 12px 14px 13px; border: 1px solid var(--line-2); background: var(--ink-2); margin-bottom: 12px; }
.upnext::before { content: ''; position: absolute; left: -1px; top: -1px; width: 26px; height: 2px; background: var(--amber); }
.upnext small { display: block; font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; }
.upnext b { display: block; font-size: 19px; line-height: 1.25; font-weight: 500; }
.upnext span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.pday h3 { margin: 10px 0 2px; font: 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 400; }
.pitem { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 5px 0; }
.pitem i { font: 11px/1.7 var(--mono); font-style: normal; color: var(--cyan-2); }
.pitem.done { opacity: .45; }
.pitem.done span { text-decoration: line-through; text-decoration-color: var(--faint); }
.pitem.done i { color: var(--faint); }
.pitem small { display: block; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; line-height: 1.5; }
.empty q { color: var(--text); quotes: '“' '”'; }

/* ---------- the globe ---------- */
.center { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.corner { position: absolute; width: 14px; height: 14px; border-color: var(--line-2); border-style: solid; pointer-events: none; }
.corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
.corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
.corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
.corner.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }
.hud { position: absolute; font: 10px/1.6 var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; pointer-events: none; }
.hud b { color: var(--text); font-weight: 500; }
.hud.tl { top: 22px; left: 26px; }
.hud.tr { top: 22px; right: 26px; text-align: right; }
.chip { position: absolute; top: 60px; left: 26px; font: 11px var(--mono); color: var(--amber); background: rgba(4, 8, 11, .9); border: 1px solid rgba(255, 181, 71, .4); padding: 5px 9px; letter-spacing: .06em; }
.born { position: absolute; top: 60px; right: 26px; max-width: 280px; font-size: 13px; background: rgba(4, 8, 11, .92); border: 1px solid var(--line-2); padding: 8px 11px; pointer-events: none; transition: opacity .6s; }
.born small { display: block; font: 10px var(--mono); color: var(--amber); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.tip { position: absolute; max-width: 260px; padding: 7px 10px; background: rgba(4, 8, 11, .92); border: 1px solid var(--line-2); font-size: 13px; line-height: 1.35; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); }
.tip small { display: block; font: 10px var(--mono); color: var(--muted); margin-bottom: 2px; letter-spacing: .06em; text-transform: uppercase; }
.readout { position: absolute; left: 26px; bottom: 22px; width: min(400px, calc(100% - 52px)); max-height: calc(100% - 110px); overflow-y: auto; padding: 14px 16px 16px; background: rgba(4, 8, 11, .94); border: 1px solid var(--line-2); }
.readout::before { content: ''; position: absolute; left: -1px; top: -1px; width: 22px; height: 2px; background: var(--cyan); }
.ro-head { display: flex; align-items: center; gap: 10px; font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.ro-head b { color: var(--cyan); font-weight: 500; }
.ro-head button { margin-left: auto; background: none; border: 0; padding: 4px; color: var(--muted); display: grid; place-items: center; }
#roText { margin: 8px 0 12px; font-size: 17px; line-height: 1.4; }
.ro-links button { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 0; font-size: 13px; }
.ro-links button span { font: 11px/1.6 var(--mono); color: var(--cyan-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ro-links button:hover { color: #fff; }

/* ---------- voice ---------- */
.dock { display: flex; align-items: flex-end; gap: 16px; border-top: 1px solid var(--line); padding: 12px 22px 14px; min-height: 76px; }
.cap { flex: 1; min-width: 0; max-height: 26vh; overflow-y: auto; }
.cap .you { font: 12px/1.5 var(--mono); color: var(--muted); }
.cap .you::before { content: 'you › '; color: var(--faint); }
.cap .reply { font-size: 15px; line-height: 1.5; margin-top: 2px; }
.cap .reply p { margin: 0 0 6px; }
.cap .reply.err { color: var(--amber); }
.cap .idle { color: var(--faint); font-size: 13px; }
.talk { position: relative; flex: none; width: 250px; height: 52px; display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px; padding: 0 14px; background: var(--ink-2); border: 1px solid var(--line-2); color: var(--text); text-align: left; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.talk::before, .talk::after { content: ''; position: absolute; width: 8px; height: 8px; border-color: var(--cyan); border-style: solid; }
.talk::before { left: -1px; top: -1px; border-width: 1px 0 0 1px; }
.talk::after { right: -1px; bottom: -1px; border-width: 0 1px 1px 0; }
.talk b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; line-height: 1.2; }
.talk small { display: block; font: 10px var(--mono); color: var(--muted); letter-spacing: .04em; }
.bars { display: flex; align-items: center; gap: 3px; height: 26px; }
.bars i { flex: 1; height: 4px; background: var(--cyan-2); transition: height .08s; }
body[data-voice="listening"] .talk { border-color: var(--cyan); background: #0a1a22; }
body[data-voice="listening"] .bars i { background: var(--cyan); }
body[data-voice="thinking"] .talk b, body[data-voice="speaking"] .talk b { color: var(--cyan); }
.hint { position: absolute; right: 22px; bottom: 74px; font: 11px var(--mono); color: var(--amber); background: rgba(4, 8, 11, .92); padding: 4px 8px; border: 1px solid rgba(255, 181, 71, .35); pointer-events: none; }

.locked { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); padding: 32px; text-align: center; z-index: 5; }
.locked p { max-width: 340px; color: var(--muted); }
.locked b { display: block; color: var(--text); font-size: 18px; margin-bottom: 6px; font-weight: 500; }

@media (max-width: 1180px) { .shell { grid-template-columns: 260px minmax(0, 1fr) 280px; } }
/* phone and narrow windows: the globe first, the talk bar under your thumb, everything else below */
@media (max-width: 900px) {
  .shell { display: flex; flex-direction: column; height: auto; padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  header { grid-template-columns: 1fr auto; padding: 12px 16px; gap: 6px 12px; }
  .clock { grid-row: 1; grid-column: 2; text-align: right; }
  .clock .t { font-size: 22px; }
  .wx { grid-column: 1 / -1; justify-self: start; text-align: left; display: flex; gap: 12px; align-items: baseline; }
  .wx .now { font-size: 15px; }
  .center { display: block; order: 1; }
  .rail.left { order: 2; }
  .rail.right { order: 3; }
  .stage { height: min(74vh, 600px); min-height: 430px; border-bottom: 1px solid var(--line); }
  .hud.tl { left: 16px; top: 14px; }
  .hud.tr { right: 16px; top: 14px; }
  .chip { left: 16px; top: 52px; }
  .born { right: 16px; left: 16px; top: 52px; max-width: none; }
  .readout { left: 10px; right: 10px; bottom: 10px; width: auto; max-height: 62%; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--ink); flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); min-height: 0; }
  .cap { max-height: 32vh; }
  .cap:empty { display: none; }
  .talk { width: 100%; height: 58px; }
  .hint { right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); }
  .rail { overflow: visible; padding: 18px 16px 8px; border: 0 !important; }
  .corner { display: none; }
}
</style>
</head>
<body data-voice="idle">
<div class="shell">
  <header>
    <div class="mark">
      <a class="back" id="back" href="./" aria-label="Back to the app" hidden><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3L5 9l6 6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></a>
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <circle cx="17" cy="17" r="15.5" fill="none" stroke="#74e0ff" stroke-opacity=".35"/>
        <ellipse cx="17" cy="17" rx="15.5" ry="6" fill="none" stroke="#74e0ff" stroke-opacity=".45"/>
        <ellipse cx="17" cy="17" rx="6" ry="15.5" fill="none" stroke="#74e0ff" stroke-opacity=".45"/>
        <circle cx="17" cy="17" r="3.2" fill="#74e0ff"/>
      </svg>
      <div><b>Second Brain</b><span id="sub">connecting…</span></div>
    </div>
    <div class="clock"><div class="t" id="clockT">--:--</div><div class="d" id="clockD"></div></div>
    <div class="wx" id="wx"></div>
  </header>

  <aside class="rail left">
    <section class="sec" id="secPlan"><h2><span>Plan</span><i></i><em id="planLeft"></em></h2><div id="plan"></div></section>
    <section class="sec" id="secAlerts" hidden><h2><span>Weather alerts</span><i></i></h2><div id="alerts"></div></section>
    <section class="sec" id="secToday" hidden><h2><span>Today</span><i></i><em id="todayN"></em></h2><div id="today"></div></section>
    <section class="sec" id="secMusic" hidden><h2><span>Now playing</span><i></i><em id="radio"></em></h2><div class="song" id="music"></div></section>
  </aside>

  <main class="center">
    <div class="stage" id="stage">
      <canvas id="map" aria-label="A globe of everything Mothball remembers about you, grouped by topic. Hold the middle to talk."></canvas>
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <div class="hud tl" id="hudL"></div>
      <div class="hud tr" id="hudR"></div>
      <button class="chip" id="chip" hidden></button>

      <div class="readout" id="readout" hidden>
        <div class="ro-head"><b id="roTopic"></b><span id="roDate"></span><button id="roClose" aria-label="Close"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
        <p id="roText"></p>
        <div class="ro-links" id="roLinks"></div>
      </div>
    </div>
    <div class="dock">
      <div class="cap" id="cap"></div>
      <button class="talk" id="talk" aria-label="Hold to talk">
        <span class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i></span>
        <span><b id="talkLabel">Hold to talk</b><small id="talkSub"></small></span>
      </button>
    </div>
    <div class="hint" id="hint" hidden></div>
  </main>

  <aside class="rail right">
    <section class="sec" id="secSessions" hidden><h2><span>Claude sessions</span><i></i><em id="sessN"></em></h2><div id="sessions"></div></section>
    <section class="sec" id="secJournal" hidden><h2><span id="journalTitle">Journal</span><i></i><em id="journalDay"></em></h2><div id="journal"></div></section>
    <section class="sec" id="secNew" hidden><h2><span>Newest memories</span><i></i></h2><div id="newest"></div></section>
    <section class="sec" id="secStats"><h2><span>Stored</span><i></i></h2><div class="stats" id="stats"></div></section>
  </aside>
</div>

<div class="locked" id="locked" hidden><p><b>Open this from Mothball</b>Right-click Mothball and pick “second brain”, or tap the brain button in the phone app.</p></div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const qs = new URLSearchParams(location.search);
let key = qs.get('k') || store.get('bestie-key') || '';
if (qs.get('k')) { store.set('bestie-key', key); history.replaceState(null, '', location.pathname + (qs.get('from') ? '?from=' + qs.get('from') : '')); }
if (qs.get('from') === 'app') $('back').hidden = false;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
let NAME = 'Mothball';

async function api(path, opts = {}) {
  const headers = Object.assign({ 'X-Bestie-Key': key }, opts.json ? { 'Content-Type': 'application/json' } : {}, opts.type ? { 'Content-Type': opts.type } : {});
  const res = await fetch(path, { method: opts.json || opts.body ? 'POST' : 'GET', cache: 'no-store', headers, body: opts.json ? JSON.stringify(opts.json) : opts.body });
  if (res.status === 401) { $('locked').hidden = false; throw new Error('locked'); }
  if (opts.raw) return res;
  const d = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(d.error || 'error ' + res.status);
  return d;
}

// ---------- clock ----------
function tick() {
  const n = new Date();
  const h = n.getHours() % 12 || 12, m = String(n.getMinutes()).padStart(2, '0'), s = String(n.getSeconds()).padStart(2, '0');
  $('clockT').innerHTML = h + ':' + m + '<small>:' + s + ' ' + (n.getHours() < 12 ? 'AM' : 'PM') + '</small>';
  $('clockD').textContent = n.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}
tick(); setInterval(tick, 1000);

// ---------- memories: topics and links ----------
const TOPICS = [
  { id: 'projects', label: 'Projects', re: /\b(projects?|developing|building|built|app|apps|bot|server|render\w*|blender|video|vr|webxr|quest|claude|session|bestie|vibe code|readme|maze|arena|synaptic|playground|trader|jev|agents?|codex|team lead|spaceship|animation)\b/gi },
  { id: 'school', label: 'School', re: /\b(ap|gov|government|class|classroom|stud(y|ying|ies)|tests?|syllabus|lecture|homework|vocab\w*|unit|slides|bureaucra\w*|congress\w*|senate|school|exam|mitosis|cytokinesis|loops?|programming|software tech)\b/gi },
  { id: 'music', label: 'Music', re: /\b(music|songs?|playlist|spotify|bowie|beatles|elton|pilots|paramore|listens?|lyrics|radio|fm)\b/gi },
  { id: 'goals', label: 'Goals', re: /\b(goals?|smart|résumé|resume|college|mites|usaco|competitions?|ambitious|curious)\b/gi },
  { id: 'people', label: 'People', re: /\b(mother|mom|dad|grandma|jen|jin|friend|family|teammate|elijah)\b/gi },
  { id: 'routine', label: 'Routines', re: /\b(reminders?|remind|daily|weekdays|alarm|routines?|schedul\w*|charge|charging)\b/gi },
  { id: 'events', label: 'Events', re: /\b(event|meeting|fbla|tsa|six flags|beta club|fundraiser|fall break)\b/gi },
  { id: 'setup', label: 'Setup', re: /\b(computer|phone|tailscale|chrome|chromebook|windows|alexa|party time|port|localhost|steam|workspace|notifications|mirroring|terminal|speakers?)\b/gi },
];
const OTHER = { id: 'personal', label: 'Personal' };
const STOP = new Set(('user users elijah wants want wanted likes like liked uses used using asked asks ask requested request requests about their them they this that with from into when then than after before what which while would could should will also just only some more most very really been being were have has had your does doing done make made making tell told said says thing things know knows knew keep keeps getting gets needs need next back still over under again once here there where whom both each such other same through during above below between because until among onto upon '
  + 'monday tuesday wednesday thursday friday saturday sunday january february march april june july august september october november december today tomorrow '
  + 'start started starting open opened turn turned play played send sent check checked help show showed work worked find found give gave take took call called '
  + 'named someone something saying added follow running finish finished come came look looked improve better able around every').split(' '));
const stem = w => w.replace(/['’]s$/, '').replace(/(ies)$/, 'y').replace(/([^s])s$/, '$1');
const wordsOf = t => [...new Set((t.toLowerCase().match(/[a-zà-ÿ][a-zà-ÿ0-9'’-]{3,}/g) || []).map(stem).filter(w => w.length >= 4 && !STOP.has(w)))];
const seeded = s => { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507) ^ Math.imul(h ^ (h >>> 13), 3266489909)) >>> 0) / 4294967296; };
const ageDays = d => { const t = Date.parse(d); return isNaN(t) ? 999 : (Date.now() - t) / 864e5; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    if (Math.abs(x - drag.x0) + Math.abs(y - drag.y0) > 6) drag.moved = true;
    if (drag.moved) {
      const k = 2.4 / Math.max(200, R * 2);
      vYaw = (x - drag.x) * k; vPitch = (y - drag.y) * k;
      yaw += vYaw; pitch = clamp(pitch + vPitch, -1.25, 1.25); focus = null;
    }
    drag.x = x; drag.y = y;
    return;
  }
  if (e.pointerType !== 'mouse' || talkPointer != null) return;
  const n = pick(x, y, 10), overCore = Math.hypot(x - cx, y - cy) < coreR * 1.25;
  cv.style.cursor = n || overCore || topics.some(t => inBox(t.box, x, y)) ? 'pointer' : drag ? 'grabbing' : 'grab';
  if (n !== hover) { hover = n; showTip(); }
});
const release = e => {
  if (e.pointerId === talkPointer) { talkPointer = null; endTalk(); return; }
  if (!drag || e.pointerId !== drag.id) return;
  const wasTap = !drag.moved, [x, y] = local(e);
  drag = null;
  if (!wasTap) return;
  const n = pick(x, y, e.pointerType === 'mouse' ? 10 : 20);
  if (n) { select(n); return; }
  const tp = topics.find(t => inBox(t.box, x, y));
  if (tp) { setFilter(topicFilter === tp ? null : tp, ''); return; }
  select(null);
};
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', e => { if (e.pointerId === talkPointer) { talkPointer = null; endTalk(); } drag = null; });
cv.addEventListener('pointerleave', () => { if (hover) { hover = null; showTip(); } });
cv.addEventListener('contextmenu', e => e.preventDefault());

function showTip() {
  const t = $('tip');
  if (!hover || hover === selected) { t.hidden = true; return; }
  t.innerHTML = '<small>' + esc(hover.topic.label) + (hover.date ? ' · ' + esc(fmtDate(hover.date)) : '') + '</small>' + esc(clip(hover.text, 140));
  t.style.left = clamp(hover.sx, 140, W - 140) + 'px'; t.style.top = hover.sy + 'px';
  t.hidden = false;
}
const clip = (s, n) => s.length > n ? s.slice(0, s.lastIndexOf(' ', n - 1) > n * 0.6 ? s.lastIndexOf(' ', n - 1) : n - 1) + '…' : s;
function fmtDate(d) { const t = Date.parse(d + 'T12:00:00'); return isNaN(t) ? d : new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }

function select(n) {
  selected = n; hover = null; showTip();
  const ro = $('readout');
  if (!n) { ro.hidden = true; return; }
  // turn the globe so it faces you, a little up and to the right of the core
  const p = n.p, yw = Math.atan2(-p[0], p[2]) + 0.42, z1 = -p[0] * Math.sin(yw) + p[2] * Math.cos(yw);
  focus = { yaw: yw, pitch: clamp(Math.atan2(p[1], z1) - 0.42, -1.25, 1.25) };
  vYaw = vPitch = 0;
  $('roTopic').textContent = n.topic.label;
  $('roDate').textContent = n.date ? 'Learned ' + fmtDate(n.date) : '';
  $('roText').textContent = n.text;
  const others = n.links.map(l => ({ o: l.a === n ? l.b : l.a, w: l.shared }));
  $('roLinks').innerHTML = others.map(x => '<button><span>' + esc(x.w.slice(0, 2).join(', ')) + '</span>' + esc(clip(x.o.text, 90)) + '</button>').join('');
  [...$('roLinks').children].forEach((b, i) => b.onclick = () => select(others[i].o));
  ro.hidden = false; ro.scrollTop = 0;
}
$('roClose').onclick = () => select(null);

function setFilter(tp, q) {
  topicFilter = tp; query = (q || '').toLowerCase();
  const chip = $('chip');
  chip.hidden = !(tp || query);
  if (tp) chip.textContent = tp.label.toUpperCase() + '  ×';
  else if (query) chip.textContent = '“' + query + '”  ' + nodes.filter(matches).length + '  ×';
  hud();
}
$('chip').onclick = () => setFilter(null, '');
let nextUp = null;
function hud() {
  // on a phone the plan is far below, so the next thing to do sits up here
  if (nextUp && innerWidth <= 900) $('hudL').innerHTML = '<span style="color:var(--amber)">Next up · ' + esc(nextUp.day) + '</span><br><b style="font:500 14px var(--ui);letter-spacing:0;text-transform:none">' + esc(nextUp.text) + '</b>';
  else $('hudL').innerHTML = 'Memory core<br><b>' + nodes.length + '</b> memories · <b>' + links.length + '</b> links · <b>' + topics.length + '</b> topics';
}
const cap1 = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

// ---------- voice: hold to talk ----------
const voice = { state: 'idle', level: 0, stream: null, rec: null, chunks: [], t0: 0, an: null, buf: null, ctx: null, audio: null, done: null, pressing: false, timer: 0 };
const LABEL = { idle: 'Hold to talk', listening: 'Listening', thinking: 'Thinking', speaking: 'Tap to stop' };
const touch = matchMedia('(pointer: coarse)').matches;
const SUB = { idle: touch ? 'or hold the core' : 'or hold the core · or space', listening: 'let go to send', thinking: '', speaking: '' };
function setVoice(s, sub) {
  voice.state = s; document.body.dataset.voice = s;
  $('talkLabel').textContent = s === 'speaking' ? NAME + ' is talking' : LABEL[s];
  $('talkSub').textContent = sub != null ? sub : s === 'speaking' ? 'tap to stop' : SUB[s];
}
function hint(text) { const h = $('hint'); h.textContent = text; h.hidden = false; clearTimeout(hint.t); hint.t = setTimeout(() => h.hidden = true, 2600); }
function silentWav() {
  const n = 800, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  let s = ''; new Uint8Array(b).forEach(x => s += String.fromCharCode(x)); return 'data:audio/wav;base64,' + btoa(s);
}
function unlockAudio() { if (voice.audio) return; voice.audio = new Audio(); voice.audio.src = silentWav(); voice.audio.play().catch(() => {}); }
function stopTracks() { if (voice.stream) voice.stream.getTracks().forEach(t => t.stop()); voice.stream = null; voice.an = null; voice.level = 0; }

async function startTalk() {
  if (voice.state === 'listening' || voice.state === 'thinking' || voice.rec) return;
  if (voice.state === 'speaking') stopSpeaking();
  unlockAudio();
  voice.pressing = true;
  if (!navigator.mediaDevices || !window.MediaRecorder) { caption(null, 'this browser can’t use the microphone.', true); return; }
  try { voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
  catch (e) { voice.pressing = false; caption(null, 'allow the microphone so you can talk to ' + NAME + '.', true); return; }
  if (!voice.pressing) { stopTracks(); hint('hold while you talk'); return; }   // let go before the mic was ready
  try {
    voice.ctx = voice.ctx || new (window.AudioContext || window.webkitAudioContext)(); await voice.ctx.resume();
    const an = voice.ctx.createAnalyser(); an.fftSize = 512; voice.ctx.createMediaStreamSource(voice.stream).connect(an);
    voice.an = an; voice.buf = new Float32Array(an.fftSize);
  } catch (_) { voice.an = null; }
  const type = MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  voice.chunks = [];
  try { voice.rec = new MediaRecorder(voice.stream, type ? { mimeType: type } : undefined); }
  catch (e) { stopTracks(); caption(null, 'this browser can’t record.', true); return; }
  voice.rec.ondataavailable = e => e.data.size && voice.chunks.push(e.data);
  voice.rec.onstop = finishTalk;
  voice.rec.start(); voice.t0 = Date.now();
  if (navigator.vibrate) navigator.vibrate(12);
  store.set('brain-talked', '1');
  setVoice('listening');
  voice.timer = setTimeout(endTalk, 90000);
  meter();
}
function meter() {
  if (voice.state !== 'listening') { $('bars').querySelectorAll('i').forEach(b => b.style.height = '4px'); return; }
  if (voice.an) {
    voice.an.getFloatTimeDomainData(voice.buf);
    let sum = 0; for (let i = 0; i < voice.buf.length; i++) sum += voice.buf[i] * voice.buf[i];
    voice.level = voice.level * 0.6 + Math.sqrt(sum / voice.buf.length) * 0.4;
  }
  const bars = $('bars').querySelectorAll('i'), t = performance.now() / 120;
  bars.forEach((b, i) => b.style.height = Math.round(4 + Math.min(22, voice.level * 160 * (0.6 + 0.4 * Math.abs(Math.sin(t + i * 1.3))))) + 'px');
  requestAnimationFrame(meter);
}
function endTalk() { voice.pressing = false; clearTimeout(voice.timer); if (voice.rec && voice.rec.state !== 'inactive') voice.rec.stop(); }
async function finishTalk() {
  const rec = voice.rec; voice.rec = null; stopTracks();
  const took = Date.now() - voice.t0, type = (rec && rec.mimeType) || 'audio/mp4';
  if (took < 450) { setVoice('idle'); hint('hold while you talk'); return; }
  setVoice('thinking', 'hearing you…');
  try {
    const heard = await api('api/listen', { body: new Blob(voice.chunks, { type }), type });
    const said = (heard.text || '').trim();
    if (!said) { setVoice('idle'); hint('didn’t catch that'); return; }
    caption(said, '');
    if (onPage(said)) { setVoice('idle'); return; }
    await ask(said);
  } catch (e) { if (e.message !== 'locked') caption(null, e.message, true); }
  if (voice.state !== 'speaking') setVoice('idle');
}

// things the page does itself: "find bowie", "show my music memories", "show everything"
function onPage(said) {
  const s = said.toLowerCase().replace(/[.!?,]+$/g, '').trim();
  if (/^(show (me )?(everything|all( of)?( it| them| my memories)?)|clear( it| that| the filter)?|reset( the view)?|never ?mind)$/.test(s)) { setFilter(null, ''); select(null); caption(null, 'showing everything.'); return true; }
  let m = s.match(/^(?:find|search(?: for)?|look for|highlight)\s+(?:my\s+|the\s+)?(.+?)(?:\s+in my memor(?:y|ies))?$/) || s.match(/^show(?: me)?(?: my| the)?\s+(.+?)\s+memor(?:y|ies)$/);
  const topicWord = s.match(/^show(?: me)?(?: my| the)?\s+(\w+)$/);
  if (!m && topicWord && topics.some(t => t.id === topicWord[1] || t.label.toLowerCase() === topicWord[1])) m = topicWord;
  if (!m) return false;
  const term = m[1].replace(/^(about|memories about|everything about)\s+/, '').trim();
  const tp = topics.find(t => t.id === term || t.label.toLowerCase() === term || t.label.toLowerCase() === term.replace(/s$/, ''));
  if (tp) { setFilter(tp, ''); caption(null, tp.label + ': ' + tp.count + ' memories.'); return true; }
  const hits = nodes.filter(n => n.text.toLowerCase().includes(term));
  if (!hits.length) return false;   // nothing on the globe: let it answer instead
  setFilter(null, term);
  if (hits.length === 1) select(hits[0]);
  caption(null, hits.length + ' memor' + (hits.length === 1 ? 'y' : 'ies') + ' about “' + term + '”.');
  return true;
}

async function ask(text) {
  let t = await api('api/ask', { json: { text, voice: true } });
  const t0 = Date.now();
  while (!t.done) {
    if (Date.now() - t0 > 240000) throw new Error('that’s taking a while; it may still finish on your computer.');
    await sleep(150);
    t = await api('api/turn?id=' + t.id);
    if (t.partial) caption(null, t.partial);
    if (t.status && t.status !== 'thinking') setVoice('thinking', String(t.status).replace(/_/g, ' ') + '…');
  }
  const reply = t.reply || t.partial || '';
  caption(null, reply);
  load();
  if (reply) await speak(reply);
}
function speak(text) {
  return new Promise(async resolve => {
    setVoice('speaking');
    voice.done = () => { voice.done = null; resolve(); };
    try {
      const res = await api('api/speak', { json: { text }, raw: true });
      if (res.status === 200 && voice.done) {
        const url = URL.createObjectURL(await res.blob()), a = voice.audio || (voice.audio = new Audio());
        a.onended = a.onerror = () => { URL.revokeObjectURL(url); if (voice.done) voice.done(); };
        a.src = url; await a.play(); return;
      }
    } catch (_) {}
    if (voice.done) voice.done();
  });
}
function stopSpeaking() { if (voice.audio) voice.audio.pause(); if (voice.done) voice.done(); setVoice('idle'); }

function md(text) {
  return esc(text || '').trim().split(/\n{2,}/).map(b => '<p>' + b.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '$1').replace(/\n/g, '<br>') + '</p>').join('');
}
function caption(you, reply, err) {
  const c = $('cap');
  if (you != null) c.dataset.you = you;
  if (reply != null) { c.dataset.reply = reply; c.dataset.err = err ? '1' : ''; }
  const y = c.dataset.you || '', r = c.dataset.reply || '';
  c.innerHTML = (y ? '<div class="you">' + esc(y) + '</div>' : '') + (r ? '<div class="reply' + (c.dataset.err ? ' err' : '') + '">' + md(r) + '</div>' : '')
    || (touch ? '' : '<div class="idle">Try “what should I do next?”, “find Bowie”, or “this weekend I want to…”</div>');
  c.scrollTop = c.scrollHeight;
}
caption();
setVoice('idle');

const talk = $('talk');
talk.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (voice.state === 'speaking') { stopSpeaking(); return; }
  try { talk.setPointerCapture(e.pointerId); } catch (_) {}
  startTalk();
});
talk.addEventListener('pointerup', () => { if (voice.state === 'listening' || voice.pressing) endTalk(); });
talk.addEventListener('pointercancel', () => endTalk());
talk.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) { e.preventDefault(); if (voice.state === 'speaking') stopSpeaking(); else startTalk(); }
  if (e.key === 'Escape') { if (voice.state === 'speaking') stopSpeaking(); select(null); setFilter(null, ''); }
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { e.preventDefault(); endTalk(); } });

// ---------- panels ----------
function rows(el, items, render) { $(el).innerHTML = items.map(render).join(''); }
function show(id, on) { $(id).hidden = !on; }

function renderPlan(days) {
  days.forEach(d => d.items.forEach(i => { i.text = cap1(i.text); i.why = cap1(i.why); }));
  const all = days.flatMap(d => d.items.map(i => Object.assign({ day: d.label }, i)));
  const open = all.filter(i => !i.done);
  nextUp = open[0] || null; hud();
  $('planLeft').textContent = open.length ? open.length + ' left' : '';
  if (!all.length) {
    $('plan').innerHTML = '<p class="empty">Hold the core and say something like <q>this weekend I want to finish my AP Gov notes, clean my room and work on Bestie</q>. ' + esc(NAME) + ' puts them in order, on days, and reminds you each day.</p>';
    return;
  }
  const next = open[0];
  $('plan').innerHTML = (next ? '<div class="upnext"><small>Next up · ' + esc(next.day) + (next.time ? ' · ' + esc(next.time) : '') + '</small><b>' + esc(next.text) + '</b>' + (next.why ? '<span>' + esc(next.why) + '</span>' : '') + '</div>'
    : '<div class="upnext"><small>Plan</small><b>All done.</b></div>')
    + days.map(d => '<div class="pday"><h3>' + esc(d.label) + '</h3>' + d.items.map((it, i) => '<div class="pitem' + (it.done ? ' done' : '') + '"><i>' + (it.done ? '✓' : String(i + 1).padStart(2, '0')) + '</i><span>' + esc(it.text)
      + (it.time || it.why ? '<small>' + esc([it.time, it.why].filter(Boolean).join(' · ')) + '</small>' : '') + '</span></div>').join('') + '</div>').join('');
}

function render(d) {
  NAME = d.name || NAME;
  document.title = 'Second Brain · ' + NAME;
  $('journalTitle').textContent = NAME + '’s journal';
  const c = d.counts || {};
  $('sub').textContent = NAME + ' · ' + (c.memories || 0) + ' memories';

  const w = d.weather;
  $('wx').innerHTML = w ? '<div class="now">' + Math.round(w.tempF) + '°<em>' + esc(w.sky || '') + (w.highF != null ? ' · H ' + Math.round(w.highF) + ' L ' + Math.round(w.lowF) : '') + '</em></div>'
    + (w.alerts && w.alerts.length ? '<span class="alert">' + w.alerts.length + ' weather alert' + (w.alerts.length > 1 ? 's' : '') + '</span>' : '') : '';
  const alerts = (w && w.alerts) || [];
  show('secAlerts', alerts.length);
  rows('alerts', alerts, a => '<div class="row alert one"><div class="v">' + esc(a.event) + '<small>until ' + esc(a.until || '?') + (a.area ? ' · ' + esc(clip(a.area, 60)) : '') + '</small></div></div>');

  renderPlan(d.plan || []);

  const now = Date.now(), agenda = d.agenda || [];
  let nextMarked = false;
  show('secToday', agenda.length); $('todayN').textContent = agenda.length || '';
  rows('today', agenda, a => {
    const t = Date.parse(a.at), past = !a.allDay && !isNaN(t) && t < now - 15 * 60000;
    const next = !past && !nextMarked && !a.allDay; if (next) nextMarked = true;
    return '<div class="row' + (past ? ' past' : '') + (next ? ' next' : '') + '"><div class="k">' + esc(a.label) + '</div><div class="v">' + esc(a.title)
      + (a.kind === 'reminder' ? '<small>reminder' + (a.repeat ? ' · ' + esc(a.repeat) : '') + '</small>' : '') + '</div></div>';
  });

  show('secMusic', !!d.music);
  if (d.music) $('music').innerHTML = '<b>' + esc(d.music.title) + '</b><span>' + esc(d.music.artist || '') + '</span>';
  $('radio').textContent = d.radio ? 'Locked In FM on air' : '';

  const mems = d.memories || [];
  const newest = mems.map((m, i) => ({ m, i })).filter(x => x.m.date).sort((a, b) => b.m.date.localeCompare(a.m.date) || b.i - a.i).slice(0, 5);
  show('secNew', newest.length);
  rows('newest', newest, x => '<div class="row mem" data-i="' + x.i + '"><div class="k">' + esc(fmtDate(x.m.date)) + '</div><div class="v clamp">' + esc(x.m.text) + '</div></div>');
  [...$('newest').children].forEach(r => r.onclick = () => { const n = nodes[+r.dataset.i]; if (n) { select(n); if (innerWidth <= 900) stage.scrollIntoView({ behavior: 'smooth' }); } });

  const sess = d.sessions || [];
  show('secSessions', sess.length); $('sessN').textContent = sess.length || '';
  rows('sessions', sess, s => '<div class="row"><div class="k">' + esc(s.ago || '') + '</div><div class="v"><span class="dot ' + esc(s.state || '') + '"></span>' + esc(s.title)
    + '<small>' + esc([s.project, s.stateLabel].filter(Boolean).join(' · ')) + '</small></div></div>');

  const j = d.journal || [];
  show('secJournal', j.length); $('journalDay').textContent = j.length && j[0].yesterday ? 'yesterday' : '';
  rows('journal', j, x => '<div class="row"><div class="k">' + esc(x.time) + '</div><div class="v clamp">' + esc(x.text) + '</div></div>');

  $('stats').innerHTML = [['memories', c.memories], ['days journaled', c.journalDays], ['notes', c.notes]]
    .map(([l, v]) => '<div><b>' + (v || 0) + '</b><span>' + l + '</span></div>').join('');

  const k = mems.map(m => m.text).join('\n');
  if (k !== memKey) {
    memKey = k;
    const keepText = selected && selected.text, before = knownTexts;
    buildGraph(mems);
    knownTexts = new Set(mems.map(m => m.text));
    selected = null; $('readout').hidden = true;
    if (keepText) { const n = nodes.find(n => n.text === keepText); if (n) select(n); }
    if (topicFilter) topicFilter = topics.find(t => t.id === topicFilter.id) || null;
    hud();
    // something new it remembered while you were here: point it out
    if (before) {
      const fresh = nodes.filter(n => !before.has(n.text));
      if (fresh.length) {
        const now2 = performance.now();
        fresh.forEach(n => n.born = now2);
        const b = $('born');
        b.innerHTML = '<small>New memory</small>' + esc(clip(fresh[fresh.length - 1].text, 120));
        b.hidden = false; b.style.opacity = 1;
        clearTimeout(render.bt); render.bt = setTimeout(() => { b.style.opacity = 0; setTimeout(() => b.hidden = true, 700); }, 6000);
      }
    }
  }
}

async function load() {
  try { render(await api('api/brain')); }
  catch (e) { if (e.message !== 'locked') $('sub').textContent = 'can’t reach ' + NAME + ' right now'; }
}

new ResizeObserver(() => layout()).observe(stage);
layout();
load();
setTimeout(load, 7000);   // the weather and calendar may still have been on their way the first time
setInterval(() => { if (!document.hidden) load(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
requestAnimationFrame(step);
})();
</script>
