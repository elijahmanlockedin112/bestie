<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Locked In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070a; --panel:#0c1016; --line:#1a212b; --fg:#eef1f4; --muted:#8a94a3; --faint:#4a5361;
  --accent:{{ACCENT}}; --warm:#ffb86b;
  --hud:'Chakra Petch', ui-monospace, 'SF Mono', Menlo, monospace;
  --ui:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------------------------------------------------------------- the session */
.app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 16px)}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% 30%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%)}
.top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;font-family:var(--hud);
  font-size:12px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;position:relative}
.top .live{display:flex;align-items:center;gap:8px;color:var(--fg)}
.top .live i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
.top .live.off i{background:var(--faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.stage{flex:1;width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;min-height:0}
.dial{position:relative;width:min(78vw,300px);aspect-ratio:1}
.dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ticks line{stroke:var(--line);stroke-width:2}
.ticks line.major{stroke:var(--faint)}
.track{fill:none;stroke:var(--line);stroke-width:5}
.prog{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .9s linear, stroke .6s}
.dial.break .prog{stroke:var(--warm)}
.pod{position:absolute;inset:21%;border-radius:50%;overflow:hidden;background:#dfeee6;
  box-shadow:0 0 0 3px var(--bg), 0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent), 0 18px 40px rgba(0,0,0,.5)}
.pod img{position:absolute;left:50%;top:52%;width:112%;transform:translate(-50%,-50%);animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-53%)}}
.say{min-height:22px;margin-top:10px;font-size:15px;color:var(--muted);text-align:center;transition:opacity .4s}

.time{font-family:var(--hud);font-weight:600;font-size:clamp(64px,19vw,84px);line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;margin-top:14px}
.phase{font-family:var(--hud);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.phase b{color:var(--accent);font-weight:600}
.dial.break ~ .phase b{color:var(--warm)}
.idle .time{color:var(--faint)}
.start{margin-top:16px;height:48px;padding:0 26px;border-radius:24px;background:var(--accent);color:#04120b;font-family:var(--hud);
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:14px;display:none}
.idle .start{display:inline-block}

.song{width:100%;max-width:420px;display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:12px 10px 12px 16px;position:relative}
.song .meta{flex:1;min-width:0}
.song .lab{font-family:var(--hud);font-size:10.5px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
.song .title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.song .title.none{color:var(--muted)}
.song .ctl{display:flex;gap:2px}
.song .ctl button{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.song .ctl button:active{background:var(--line)}
.song svg{width:20px;height:20px;fill:var(--fg)}
.unlock{margin-top:12px;height:44px;padding:0 18px;font-family:var(--hud);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
.unlock.arm{color:var(--warm)}
.err{position:absolute;top:calc(env(safe-area-inset-top) + 44px);left:20px;right:20px;text-align:center;font-size:14px;color:var(--warm)}

/* ---------------------------------------------------------------- the intro */
.intro{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:hidden;display:none}
.intro.on{display:block}
.intro .grid{position:absolute;inset:-2px;opacity:0;
  background-image:linear-gradient(color-mix(in srgb,var(--accent) 14%,transparent) 1px,transparent 1px),
                   linear-gradient(90deg,color-mix(in srgb,var(--accent) 14%,transparent) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent);mask-image:radial-gradient(closest-side,#000 30%,transparent)}
.intro .scan{position:absolute;left:0;right:0;height:2px;top:-4px;background:var(--accent);box-shadow:0 0 18px 2px var(--accent);opacity:0}
.intro .corner{position:absolute;font-family:var(--hud);font-size:10.5px;letter-spacing:.2em;color:color-mix(in srgb,var(--accent) 80%,var(--fg));
  text-transform:uppercase;opacity:0;white-space:pre}
.intro .tl{top:calc(env(safe-area-inset-top) + 16px);left:18px}
.intro .tr{top:calc(env(safe-area-inset-top) + 16px);right:18px;text-align:right}
.intro .bl{bottom:calc(env(safe-area-inset-bottom) + 18px);left:18px}
.intro .br{bottom:calc(env(safe-area-inset-bottom) + 18px);right:18px;text-align:right}
.intro .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.intro .ring{width:min(70vw,270px);aspect-ratio:1;position:absolute;opacity:0}
.intro .ring circle{fill:none;stroke:var(--accent);stroke-width:1.5}
.intro .ring .seg{stroke-width:4;stroke-dasharray:60 400}
.intro .engaging{font-family:var(--hud);font-size:12px;letter-spacing:.4em;color:var(--accent);opacity:0}
.intro .word{font-family:var(--hud);font-weight:700;font-size:clamp(64px,21vw,96px);line-height:.9;letter-spacing:.04em;opacity:0;position:relative}
.intro .bar{height:5px;background:var(--accent);width:0;margin-top:12px;align-self:center}
.intro .sub{font-family:var(--hud);font-weight:600;font-size:15px;letter-spacing:.42em;margin-top:16px;opacity:0;padding-left:.42em}
.intro .cleared{font-family:var(--hud);font-size:13px;letter-spacing:.14em;color:var(--muted);margin-top:26px;min-height:18px;text-transform:uppercase}
.intro .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.intro .engage{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.intro.wait .engage{display:flex}
.engage .btn{width:150px;height:150px;border-radius:50%;border:1.5px solid var(--accent);display:grid;place-items:center;position:relative;
  font-family:var(--hud);font-weight:700;letter-spacing:.3em;font-size:15px;color:var(--accent);padding-left:.3em}
.engage .btn::before,.engage .btn::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);animation:ping 2.2s infinite}
.engage .btn::after{animation-delay:1.1s}
@keyframes ping{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.engage .hint{font-family:var(--hud);font-size:11px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase}

/* the sequence: .go starts it; the lock lands at 0.82 s, with the sound */
.intro.go .grid{animation:fadeIn .5s ease-out forwards}
.intro.go .scan{animation:scan .8s cubic-bezier(.5,0,.6,1) forwards}
.intro.go .corner{animation:fadeIn .3s .1s forwards}
.intro.go .ring{animation:ringIn .8s cubic-bezier(.2,.8,.2,1) forwards, spin 6s linear infinite}
.intro.go .engaging{animation:blink .16s steps(2) 5 forwards, gone 0s .8s forwards}
.intro.go .word{animation:slam .42s .82s cubic-bezier(.2,1.4,.4,1) forwards}
.intro.go .bar{animation:sweep .45s 1s cubic-bezier(.6,0,.2,1) forwards}
.intro.go .sub{animation:track .6s 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.intro.go .flash{animation:hit .32s .82s ease-out}
.intro.go .center{animation:shake .22s .82s}
.intro.out{animation:out .5s ease-in forwards}
@keyframes fadeIn{to{opacity:1}}
@keyframes gone{to{opacity:0}}
@keyframes blink{50%{opacity:1}}
@keyframes scan{0%{top:-4px;opacity:1}100%{top:100%;opacity:.2}}
@keyframes ringIn{from{opacity:0;transform:scale(.6)}to{opacity:.55;transform:scale(1)}}
@keyframes spin{to{rotate:360deg}}
@keyframes slam{from{opacity:0;transform:scale(1.35);filter:blur(10px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes sweep{to{width:min(62vw,250px)}}
@keyframes track{from{opacity:0;letter-spacing:.9em}to{opacity:.85;letter-spacing:.42em}}
@keyframes hit{0%{opacity:.95}100%{opacity:0}}
@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,2px)}}
@keyframes out{to{opacity:0;transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.intro.go .center{animation:none}.intro.go .ring{animation:ringIn .8s forwards}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top"><span class="live" id="live"><i></i><span id="liveText">Locked in</span></span><span id="blocks"></span></div>
  <div class="err" id="err" hidden></div>
  <div class="stage" id="stage">
    <div class="dial" id="dial">
      <svg viewBox="0 0 300 300" aria-hidden="true">
        <g class="ticks" id="ticks"></g>
        <circle class="track" cx="150" cy="150" r="128"/>
        <circle class="prog" id="prog" cx="150" cy="150" r="128" transform="rotate(-90 150 150)"/>
      </svg>
      <div class="pod"><img id="face" src="face-big/think.png" alt="{{NAME}}"></div>
    </div>
    <div class="say" id="say"></div>
    <div class="time" id="time">--:--</div>
    <div class="phase" id="phase"><b>Focus</b></div>
    <button class="start" id="start">Lock in</button>
  </div>
  <div class="song">
    <div class="meta"><div class="lab">On the PC</div><div class="title none" id="song">Nothing playing</div></div>
    <div class="ctl">
      <button id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="play" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
      <button id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button>
    </div>
  </div>
  <button class="unlock" id="unlock">Unlock</button>
</div>

<div class="intro" id="intro">
  <div class="grid"></div>
  <div class="scan"></div>
  <div class="corner tl" id="cTl">SYS / {{NAME}}
LINK  OK</div>
  <div class="corner tr" id="cTr"></div>
  <div class="corner bl">NODE  ELIJAHMAN
PORT  8445</div>
  <div class="corner br" id="cBr"></div>
  <div class="center">
    <svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" opacity=".35"/><circle class="seg" cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="80" stroke-dasharray="2 6" opacity=".6"/></svg>
    <div class="engaging">Engaging</div>
    <div class="word">LOCK IN</div>
    <div class="bar"></div>
    <div class="sub">MODE ACTIVATED</div>
    <div class="cleared" id="cleared"></div>
  </div>
  <div class="flash"></div>
  <div class="engage"><button class="btn" id="engage">ENGAGE</button><div class="hint">Tap for sound</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
const qs = new URLSearchParams(location.search);
let key = qs.get('k') || store.get('bestie-key') || '';
const fresh = qs.has('go');   // opened by the tag: play the intro
if (qs.get('k')) store.set('bestie-key', key);
if (qs.get('k') || fresh) history.replaceState(null, '', location.pathname);

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: Object.assign({ 'X-Bestie-Key': key }, body ? { 'Content-Type': 'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  if (r.status === 401) throw new Error('This phone isn’t paired. Open the Locked In link from your Shortcut once.');
  if (!r.ok) throw new Error('Bestie didn’t answer (' + r.status + ').');
  return r.json();
}

// ------------------------------------------------------------------ the dial
const R = 128, C = 2 * Math.PI * R;
$('prog').style.strokeDasharray = C;
$('prog').style.strokeDashoffset = C;
(function ticks() {
  let s = '';
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * 2 * Math.PI, major = i % 5 === 0, r1 = 142, r2 = major ? 150 : 147;
    s += '<line class="' + (major ? 'major' : '') + '" x1="' + (150 + r1 * Math.sin(a)).toFixed(1) + '" y1="' + (150 - r1 * Math.cos(a)).toFixed(1)
      + '" x2="' + (150 + r2 * Math.sin(a)).toFixed(1) + '" y2="' + (150 - r2 * Math.cos(a)).toFixed(1) + '"/>';
  }
  $('ticks').innerHTML = s;
})();

let st = null, gotAt = 0;
const lines = {
  focus: ['eyes on the prize.', 'one thing at a time.', 'i’ll guard the tabs.', 'you’re doing great. keep going.', 'deep breath. back to it.', 'future you says thanks.'],
  break: ['break time. stand up!', 'drink some water.', 'look at something far away.', 'stretch it out.'],
  idle: ['ready when you are.', 'tap the tag or press lock in.']
};
let sayAt = 0, sayKind = '';
function say(kind) {
  if (kind === sayKind && Date.now() - sayAt < 30000) return;
  sayKind = kind; sayAt = Date.now();
  const pool = lines[kind], el = $('say');
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = pool[Math.floor(Math.random() * pool.length)]; el.style.opacity = 1; }, 350);
}
const clock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
let lastFace = '';
function face(mood) { if (mood !== lastFace) { lastFace = mood; $('face').src = 'face-big/' + mood + '.png'; } }

function draw() {
  if (!st) return;
  const running = st.running, paused = st.paused, brk = st.phase === 'break';
  const left = running ? (paused ? st.left : Math.max(0, st.left - (Date.now() - gotAt) / 1000)) : 0;
  document.body.classList.toggle('idle', !running);
  $('stage').classList.toggle('idle', !running);
  $('dial').classList.toggle('break', running && brk);
  $('live').classList.toggle('off', !running);
  $('liveText').textContent = running ? (paused ? 'Paused' : brk ? 'On a break' : 'Locked in') : 'Not locked in';
  $('blocks').textContent = st.blocksToday ? 'Block ' + st.blocksToday : '';
  $('time').textContent = running ? clock(left) : clock(st.focusMinutes * 60);
  const frac = running && st.length ? left / st.length : 0;
  $('prog').style.strokeDashoffset = C * (1 - frac);
  if (running) {
    const ends = new Date(Date.now() + left * 1000).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    $('phase').innerHTML = '<b>' + (brk ? 'Break' : 'Focus') + '</b> · ' + (paused ? 'paused' : 'until ' + ends);
  } else $('phase').innerHTML = '<b>' + st.focusMinutes + ' min</b> blocks';
  face(!running ? 'sleep' : brk ? 'happy' : paused ? 'normal' : 'think');
  say(!running ? 'idle' : brk ? 'break' : 'focus');
  const song = $('song');
  song.textContent = st.playing || 'Nothing playing';
  song.classList.toggle('none', !st.playing);
}

async function refresh() {
  try { st = await api('/api/lockin'); gotAt = Date.now(); $('err').hidden = true; draw(); }
  catch (e) { $('err').textContent = e.message; $('err').hidden = false; }
}
setInterval(draw, 500);
setInterval(refresh, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

async function media(v) {
  try { const s = await api('/api/control', { action: 'media', value: v }); if (st) { st.playing = s.playing || null; draw(); } } catch (e) {}
  setTimeout(refresh, 1200);
}
$('prev').onclick = () => media('previous');
$('play').onclick = () => media('play');
$('next').onclick = () => media('next');

let armed = 0;
$('unlock').onclick = async () => {
  if (Date.now() - armed > 3000) { armed = Date.now(); $('unlock').textContent = 'Tap again to unlock'; $('unlock').classList.add('arm');
    setTimeout(() => { if (Date.now() - armed >= 3000) { $('unlock').textContent = 'Unlock'; $('unlock').classList.remove('arm'); } }, 3100); return; }
  armed = 0; $('unlock').textContent = 'Unlock'; $('unlock').classList.remove('arm');
  try { await api('/api/control', { action: 'lockin', value: 'off' }); } catch (e) {}
  refresh();
};
$('start').onclick = async () => {
  intro(true);
  try { await api('/api/control', { action: 'lockin' }); } catch (e) {}
  refresh();
};

// ------------------------------------------------------------------ the intro, with its sound
let ctx = null, sound = null;
function audio() {
  if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); }
  if (ctx && !sound) sound = fetch('lockin.wav').then(r => r.arrayBuffer()).then(b => new Promise((ok, no) => ctx.decodeAudioData(b, ok, no))).catch(() => null);
  return sound;
}
async function play() {
  const buf = await audio();
  if (!buf || !ctx) return;
  const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination); src.start();
}
function hud() {
  const now = new Date();
  $('cTr').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }) + '\n' + now.toLocaleDateString([], { month: 'short', day: '2-digit' }).toUpperCase();
  $('cBr').textContent = 'SEQ ' + Math.floor(Math.random() * 0xffff).toString(16).toUpperCase().padStart(4, '0') + '\nBLOCK ' + String((st && st.blocksToday) || 1).padStart(2, '0');
}
let introTimer = 0;
function intro(withSound) {
  const el = $('intro');
  clearTimeout(introTimer);
  el.classList.remove('go', 'out', 'wait');
  void el.offsetWidth;   // restart the animations
  el.classList.add('on', 'go');
  hud(); const h = setInterval(hud, 120);
  if (withSound) play();
  $('cleared').textContent = '';
  setTimeout(() => {
    const c = st && st.cleared;
    typeIn($('cleared'), c ? 'Cleared  ·  ' + c : 'All clear');
  }, 1500);
  introTimer = setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.classList.remove('on', 'go', 'out'); clearInterval(h); }, 500); }, 3000);
}
function typeIn(el, text) {
  let i = 0; const t = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(t); }, 22);
}
$('engage').onclick = async () => {
  audio();
  try { if (ctx && ctx.state !== 'running') await ctx.resume(); } catch (_) {}
  intro(true);
};
document.querySelector('.top').addEventListener('click', () => { audio(); if (ctx) ctx.resume().catch(() => {}); intro(true); });

(async function start() {
  await refresh();
  if (!fresh) return;
  // the browser decides whether sound can start on its own; if not, one tap on ENGAGE plays it in sync
  audio();
  let allowed = false;
  try { if (ctx) { if (ctx.state !== 'running') await Promise.race([ctx.resume(), new Promise(r => setTimeout(r, 250))]); allowed = ctx.state === 'running'; } } catch (_) {}
  if (allowed) intro(true);
  else { const el = $('intro'); el.classList.add('on', 'wait'); }
})();
</script>
</body>
</html>
