<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>bestie bridge</title>
<style>
  :root { color-scheme: light dark; --bg: #fbf8ff; --fg: #2b2238; --dim: #6f6480; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1a24; --fg: #efe8f7; --dim: #a79cb6; } }
  body { margin: 0; width: 250px; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, "Segoe UI", sans-serif; }
  .row { display: flex; gap: 12px; align-items: center; padding: 14px 16px; }
  img { width: 40px; height: 40px; flex: none; }
  #status { font-weight: 600; }
  #detail { color: var(--dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <img src="icons/icon48.png" alt="">
    <div>
      <div id="status">looking for bestie…</div>
      <div id="detail"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
